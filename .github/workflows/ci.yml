# CI — runs on every PR. OWNER: Mariam.
#
# Three gates, and every one of them has to be able to fail:
#
#   lint  ruff over the package.
#   test  the suite, with the model pinned off. The runner has no AWS
#         credentials, so LLM_DISABLED puts every agent on its fixture rather
#         than letting it attempt a Bedrock call it cannot make.
#   scan  the REAL security scanners over the poisoned and clean fixtures. This
#         is the check that proves the wrappers still catch the AWS key the
#         demo blocks on, rather than that they merely import.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; checkout is the only thing that needs
# a token at all.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # pyproject pins ruff>=0.16,<0.17 and the repo carries no [tool.ruff]
      # section, so this runs ruff's own defaults — the same rules a developer
      # gets locally, which is what makes a red check here reproducible. Do not
      # add per-file ignores or noqa comments to turn this green.
      - name: Ruff lint
        run: ruff check agentorg

  test:
    runs-on: ubuntu-latest
    env:
      # JOB level, not step level. Without it every agent tries Bedrock and the
      # runner has no credentials. tests/conftest.py closes the same seam from
      # the other side, for laptops that DO have credentials.
      LLM_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Regenerate + validate fixtures
        run: python make_fixtures.py

      # DELIBERATELY no scanner binaries in this job. Five assertions expect
      # len(blocking) == 2, and today that 2 comes from the fixture fallback in
      # agents/security.py: with nothing on PATH, run_all_scanners raises
      # FileNotFoundError and the agent falls back. Install gitleaks/semgrep/
      # trivy here and those five silently switch to the real-scanner path.
      # Measured: the suite still passes 65/65 either way, but the run goes from
      # 0.16s to 33.9s and starts pulling a ~108 MB trivy database on every
      # push. The real binaries belong in `scan`, which is about them.
      - name: Run tests
        run: pytest -q

  scan:
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose. An unpinned scanner that changes its rules turns this
      # check red on code nobody touched. Bump a version deliberately, then
      # re-run scripts/scan_gate.py and update its expected findings if they
      # moved. Measured on these three: poisoned -> 2 critical, clean -> 0.
      GITLEAKS_VERSION: "8.21.2"
      TRIVY_VERSION: "0.74.0"
      SEMGREP_VERSION: "1.172.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # ALL THREE binaries, not just gitleaks. run_all_scanners fans out in the
      # order (semgrep, gitleaks, trivy) and every wrapper shells out through
      # subprocess.run, which raises FileNotFoundError when its binary is
      # absent — so a job carrying only gitleaks dies on semgrep before gitleaks
      # ever runs. Verified locally: the gate exits 1 with any one of the three
      # missing, which is the correct behaviour but a useless check.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Install trivy
        run: |
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy

      # Semgrep gets its OWN virtualenv, and is then symlinked onto PATH rather
      # than having its bin directory prepended — prepending would shadow
      # setup-python's `python` for every later step. It is a pip package with
      # hard pins (mcp==1.23.3, opentelemetry-*~=1.37.0, jsonschema~=4.25.1)
      # and this project already carries mcp 1.29.0 and opentelemetry 1.44.0
      # underneath strands-agents, so installing it alongside would quietly
      # downgrade the agent framework's dependencies in the middle of a security
      # check. The wrappers only need `semgrep` on PATH; they never import it.
      - name: Install semgrep
        run: |
          python -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet "semgrep==${SEMGREP_VERSION}"
          sudo ln -s /tmp/semgrep-venv/bin/semgrep /usr/local/bin/semgrep

      # Cheaper to fail here, naming the binary, than to decode a
      # FileNotFoundError raised from inside a wrapper three steps later.
      - name: Scanner versions
        run: |
          gitleaks version
          trivy --version
          semgrep --version

      # `trivy fs` downloads a ~108 MB vulnerability database on a cold cache
      # (measured: 18s) and, when it cannot, exits 1 having written NO report —
      # which trivy_tool turns into RuntimeError and this job into a red check
      # on code nobody touched. Do that fetch HERE, retried, so a registry blip
      # reads as infrastructure rather than as a scanner failure; the gate below
      # then runs against a warm cache. Trivy already falls back from
      # mirror.gcr.io to ghcr.io by itself. Do NOT set TRIVY_CACHE_DIR: the gate
      # invokes trivy exactly as the security agent does, with no environment
      # overrides, so it must find this database at trivy's default location.
      - name: Warm the trivy vulnerability database
        run: |
          for attempt in 1 2 3; do
            if trivy fs --download-db-only --timeout 10m .; then
              exit 0
            fi
            echo "trivy database download failed (attempt ${attempt}/3)"
            if [ "${attempt}" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "trivy could not fetch its vulnerability database; see above"
          exit 1

      # The gate is a checked-in script rather than a heredoc so that the bytes
      # CI runs are the bytes anyone can run on a laptop — a heredoc inside
      # `run: |` cannot be, and YAML indentation silently rewrites Python.
      # scripts/scan_gate.py says what it proves and why nothing in it is
      # wrapped in try/except.
      - name: Scan gate
        run: python scripts/scan_gate.py
