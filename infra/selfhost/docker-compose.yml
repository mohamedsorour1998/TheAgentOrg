# The whole platform on your own compute. Lane F, task F4.
#
#     docker compose -f infra/selfhost/docker-compose.yml up
#
# THIS IS THE SELF-HOSTED DEMO VEHICLE, NOT A DEV CONVENIENCE. The claim it exists
# to support is one sentence: a poisoned ticket blocks, with no AWS call. Every
# service below is here because that sentence needs it, and the two that are
# commented out are absent for a stated reason rather than an oversight.
#
# WHAT IS VERIFIED AND WHAT IS NOT, stated at the top because this file's own
# CI gate cannot run:
#
#   VERIFIED on the author's machine (no Docker daemon available):
#     - `docker-compose -f … config` parses this file and resolves every
#       interpolation. That is a SYNTAX and REFERENCE check, nothing more.
#     - The pipeline it describes was run WITHOUT containers, on the same host,
#       against a real local model: a poisoned ticket reached `verdict=block`,
#       `provenance=scanners`, `blocking=2` at added-lines 3 and 4, with the
#       network witness recording no AWS hostname and `127.0.0.1` as the only
#       host contacted. See `docs/selfhost-runbook.md` for that transcript.
#
#   NOT VERIFIED, and nothing in this repository can claim otherwise:
#     - `docker compose up` has never been executed against this file. There is
#       no Docker daemon on the machine it was written on (`docker info` fails
#       with "dial unix /var/run/docker.sock: connect: no such file or
#       directory"), and neither podman nor colima has a VM configured.
#     - Therefore the IMAGE BUILDS are unproven. `agentorg/agents/Dockerfile` is
#       built by CodeBuild for arm64 today; whether it builds under a local
#       daemon is a different question and this file does not answer it.
#
# A compose file that parses is not a stack that runs, and the distinction is
# exactly the one this repository draws between a green `terraform apply` and
# `simulate-principal-policy`. Do not present this as a demonstrated stack until
# somebody has run it.

name: theagentorg-selfhost

services:

  # ── THE DATABASE ───────────────────────────────────────────────────────────
  #
  # ONE Postgres for the queue AND the application, which Phase 0 made possible
  # by accepting `postgres` as a `QUEUE_BACKEND`. Two databases would mean a run
  # could be enqueued and not recorded, or recorded and not enqueued, with no
  # transaction spanning the pair -- and the queue's whole correctness argument
  # (a pause is a durable ROW) rests on the row and the run agreeing.
  # ─────────────────────────────────────────────────────────────────────────
  # THE POSTGRES SERVICE IS GONE, 2026-09-10. See
  # `docs/design/dynamodb-migration.md`.
  #
  # Tenancy, the queue and the run index live in DynamoDB now. There is no port
  # to publish, no DSN, no password and no volume -- which is the whole reason
  # the migration happened: Amplify's SSR compute cannot join a VPC, so a
  # Postgres the deployed app could reach had to be a Postgres on the public
  # internet.
  #
  # CREDENTIALS COME FROM THE OPERATOR'S OWN AWS SESSION, mounted read-only into
  # the containers below. There is no static key in this file and there must
  # never be one.
  # ─────────────────────────────────────────────────────────────────────────

  model:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # THE MODEL MUST BE PULLED BEFORE ANY AGENT ASKS FOR IT, and a 4.7 GB pull is
  # not something to do inside the worker's first stage. A one-shot service with
  # `restart: "no"` does it once and exits 0; the worker waits on its completion.
  #
  # Without this, the first agent call fails, `llm.text()` catches it BY DESIGN,
  # and every agent serves its fixture while the stack looks healthy -- the
  # signature defect this repository exists to prevent, reproduced by an absent
  # `docker compose` dependency.
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      model:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://model:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'ollama pull "${SELFHOST_MODEL:-qwen2.5-coder:7b}"'
    restart: "no"

  # ── THE WORKER ─────────────────────────────────────────────────────────────
  #
  # Lane A's worker, unchanged, on our own compute. THIS IS F3, and it is
  # SATISFIED BY LANE A rather than built here: `scripts/worker.py` already
  # claims one stage at a time from a durable queue and takes no run parameters,
  # because they live on the row. All this file contributes is the compute.
  worker:
    build:
      context: ../..
      # `infra/worker/Dockerfile`, NOT the agent image. This pointed at
      # `agentorg/agents/Dockerfile` until 2026-08-28, and that image cannot run this
      # service's own command: the repository root `.dockerignore:51` is `scripts/`, so
      # `scripts/worker.py` is stripped from the context before the build sees it. The
      # container would have started and died on a missing file.
      #
      # Lane N found it and built the second image for exactly this reason. Same defect
      # shape as `COPY fixtures ./fixtures`, which was measured on the first runtime that
      # served traffic: `/ping` answered 200 and every `/invocations` raised
      # FileNotFoundError.
      dockerfile: infra/worker/Dockerfile
    # `postgres` used to be the other entry here and was removed with the service.
    # `model-pull` stays: the worker must not start before the model is present.
    depends_on:
      model-pull:
        condition: service_completed_successfully
    environment:
      # ── DynamoDB replaces the DSN ────────────────────────────────────────
      # No host, no port, no password. boto3 resolves credentials from the
      # mounted session below, and the SSR compute role does it ambiently when
      # deployed. `TENANCY_TABLE` carries the same literal as
      # `infra/Terraform/modules/tenancy`'s default -- two places, one value,
      # deliberately, so changing one obliges changing the other.
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
      TENANCY_TABLE: theagentorg-tenancy
      # THE QUEUE AND THE APP SHARE ONE DATABASE. See the postgres service.
      QUEUE_BACKEND: dynamodb

      # THE MODEL. `LLM_API_KEY` MUST NOT BE `not-needed`: both
      # `llm.available()` and `common/model.create_model()` refuse that literal,
      # so leaving it at its default sends every agent to its fixture with the
      # run still green. MEASURED -- with only LLM_BASE_URL set,
      # `llm.available()` returns False. A local gateway ignores the value, which
      # is precisely what makes the default dangerous rather than merely wrong.
      LLM_BASE_URL: http://model:11434/v1
      LLM_API_KEY: selfhost-local-gateway-ignores-this
      LLM_MODEL: "${SELFHOST_MODEL:-qwen2.5-coder:7b}"

      # NO AWS ANYTHING. No AWS_REGION, no credentials, no role. The absence is
      # the point, and it is deliberately NOT the evidence: with no credentials
      # `llm.available()` would return False on the Bedrock path anyway, so a
      # green run here proves nothing on its own. The evidence is
      # `agentorg/selfhost/airgap.py`, which intercepts DNS and connect and
      # names every host the process reached.

      # OFFLINE closes the GitHub seam. It does NOT disable the model -- CLAUDE.md
      # measures that, and `llm.available()` never reads it. Both are needed for a
      # genuinely offline run; here only the GitHub half is wanted, because the
      # model IS the local one.
      OFFLINE: "true"

      # The three scanners are in this image and this is the stack that can
      # honestly demand them. On the security stage a missing binary must be a
      # FAULT rather than a dev affordance -- otherwise a scanner that failed to
      # install turns into a fixture fallback and the poisoned ticket blocks for
      # the wrong reason, with `provenance` the only thing that would say so.
      SCANNERS_REQUIRED: "true"
      SECURITY_BLOCK_THRESHOLD: high
      AGENT_ROLE: security
    volumes:
      # READ-ONLY, and the operator's real session rather than a key pasted into
      # this file. CLAUDE.md's rule is zero static AWS keys anywhere; a compose
      # file is exactly the place one would otherwise land and be committed.
      - ${HOME}/.aws:/aws:ro
    # The image's default command serves the HTTP agent; this service runs the
    # worker loop instead. `--forever` claims jobs until stopped.
    command: ["python", "scripts/worker.py", "--forever"]
    restart: unless-stopped

  # ── THE API AND THE UI ─────────────────────────────────────────────────────
  #
  # ADDED 2026-08-28, on the terms the note below set: both lanes have landed, both
  # services bind 127.0.0.1 on the host, and both depend on postgres.

  # ── THE APPLICATION CONNECTS AS A NON-OWNING ROLE ──────────────────────────
  #
  # Every DSN below names `agentorg_app`, NOT the `agentorg` owner, and that single
  # choice decides whether six RLS policies enforce anything or are decoration.
  # MEASURED against this container, same database, same policies, two connections:
  #
  #   OWNER (superuser)            attacker sees ['run-t-attacker', 'run-t-victim']
  #                                unscoped read 2 rows          <- LEAK
  #   agentorg_app (plain LOGIN)   attacker sees ['run-t-attacker']
  #                                unscoped read 0 rows          <- refused
  #
  # Postgres skips row-level security for a superuser, for any role with BYPASSRLS,
  # and for the table's OWNER. `FORCE ROW LEVEL SECURITY`, which schema.py emits and
  # a test pins, addresses only the third — nothing in SQL can constrain a superuser.
  # And `pg_policies` lists all six either way, so the wrong DSN reports perfectly
  # healthy.
  #
  # The role is created by `agentorg/db/provision.py`; `render_sequence()` prints the
  # four steps an operator runs. Two traps it encodes, each of which produced a wrong
  # diagnosis first: `GRANT ... ON ALL TABLES` covers only tables that exist AT THE
  # TIME, and table grants are useless without `GRANT USAGE ON SCHEMA public` — both
  # surface as `relation "x" does not exist`, which names the table and hides the
  # cause.
  #
  # THE MIGRATIONS STILL RUN AS THE OWNER. That is the point of two roles: the role
  # that creates a table owns it and therefore escapes its policies, so it must not be
  # the role the application uses.

  api:
    build:
      context: ../..
      # THE WORKER IMAGE, REUSED. `agentorg/api/` is standard-library only —
      # deliberately, because `tests/test_agentcore_deploy_assets.py` asserts every
      # third-party import under `agentorg/` appears in the agent requirements, so a
      # framework here would become a dependency of all five arm64 agent containers.
      # That decision is what lets this service need no image of its own.
      dockerfile: infra/worker/Dockerfile
    environment:
      # ── DynamoDB replaces the DSN ────────────────────────────────────────
      # No host, no port, no password. boto3 resolves credentials from the
      # mounted session below, and the SSR compute role does it ambiently when
      # deployed. `TENANCY_TABLE` carries the same literal as
      # `infra/Terraform/modules/tenancy`'s default -- two places, one value,
      # deliberately, so changing one obliges changing the other.
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
      TENANCY_TABLE: theagentorg-tenancy
      QUEUE_BACKEND: dynamodb
      OFFLINE: "true"
      # LLM_DISABLED IS LOAD-BEARING HERE, AND IT WAS MISSING UNTIL 2026-09-15.
      #
      # `OFFLINE` closes the GitHub seam and does NOT disable the model -- CLAUDE.md
      # records that trap twice. `llm.available()` falls through to boto3 whenever
      # `LLM_BASE_URL` is empty, and this service now MOUNTS a credential for
      # DynamoDB, so it found one: measured, `api` could make a live billable
      # Bedrock call inside a stack whose entire claim is that it is self-hosted.
      #
      # Before the DynamoDB migration this was impossible -- there were no
      # credentials anywhere in this file, and the test forbidding them is what
      # made `LLM_BASE_URL` unnecessary to think about. Adding credentials removed
      # that guard along with the thing it guarded.
      #
      # The control plane never calls a model: submit, watch and cancel are
      # `queue.enqueue` / `jobs_for_run` / `complete`, and `grep` for `llm.` in
      # `agentorg/api/` matches one COMMENT and nothing else. So disabling it
      # states a fact rather than imposing a restriction.
      LLM_DISABLED: "true"
      # 0.0.0.0 INSIDE THE NAMESPACE, 127.0.0.1 ON THE HOST. The container has to bind
      # every interface of its own namespace or the port publish below reaches nothing —
      # and the publish is what keeps it off the network. `main()` defaults to loopback
      # precisely so this has to be said out loud; see api/server.py.
      API_HOST: 0.0.0.0
      API_PORT: "8100"
    volumes:
      # READ-ONLY, and the operator's real session rather than a key pasted into
      # this file. CLAUDE.md's rule is zero static AWS keys anywhere; a compose
      # file is exactly the place one would otherwise land and be committed.
      - ${HOME}/.aws:/aws:ro
    command: ["python", "-m", "agentorg.api.server"]
    ports:
      # 127.0.0.1 ONLY. Every authenticated route refuses without a provisioned M2M key
      # and no route can approve a gate, but an unauthenticated caller still reaches
      # /v1/health, /v1/openapi.json and the ingress endpoint — so the bind stays local.
      - "127.0.0.1:8100:8100"
    restart: unless-stopped

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    environment:
      # ── DynamoDB replaces the DSN ────────────────────────────────────────
      # No host, no port, no password. boto3 resolves credentials from the
      # mounted session below, and the SSR compute role does it ambiently when
      # deployed. `TENANCY_TABLE` carries the same literal as
      # `infra/Terraform/modules/tenancy`'s default -- two places, one value,
      # deliberately, so changing one obliges changing the other.
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
      TENANCY_TABLE: theagentorg-tenancy
      # FAKE, LOCAL-ONLY VALUES. `next build` refuses without all four — Lane I's
      # fail-closed design firing at build time — and GitHub OAuth cannot complete
      # against them, which is correct for a self-hosted stack nobody registered an app
      # for. A real deployment supplies real ones from a secret store.
      AUTH_SECRET: selfhost-dev-only-not-a-credential
      AUTH_GITHUB_ID: selfhost-dev-only
      AUTH_GITHUB_SECRET: selfhost-dev-only
      # `localhost`, NOT `127.0.0.1`, AND THE CHOICE HAS TO BE MADE ONCE FOR BOTH.
      # GitHub compares an OAuth callback as a STRING: `http://localhost:3000/...` and
      # `http://127.0.0.1:3000/...` are the same machine and different origins, and a
      # mismatch answers `redirect_uri_mismatch` — which reads as a broken app rather
      # than a typo. Auth.js builds its own callback from AUTH_URL, so this value and the
      # URL registered in the GitHub OAuth App must agree exactly.
      #
      # `localhost` is chosen because that is what a browser address bar gets typed with,
      # and because `localhost` resolves to BOTH ::1 and 127.0.0.1 while the published
      # port below binds IPv4 only — so `localhost` works and `[::1]` does not. Measured:
      #
      #     http://127.0.0.1:3000  -> 200
      #     http://localhost:3000  -> 200
      #     http://[::1]:3000      -> connection refused
      #
      # The port publish stays `127.0.0.1:` regardless: that is what keeps this off the
      # network, and it is an address to bind rather than a name to visit.
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # THE LIVE COGNITO POOL, provisioned 2026-09-09 by `infra/cognito/provision.py`.
      # None of these is a secret: an issuer, a PUBLIC client id, and a hosted-UI domain.
      # The client is provisioned with no secret (verified: `has secret: False`), which is
      # why `COGNITO_CLIENT_SECRET` appears nowhere — a public client is correct for a
      # browser-driven authorization-code flow and removes a credential from every
      # environment that would otherwise have to carry one.
      COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_Pyt161csn
      COGNITO_CLIENT_ID: 2uc5d3stt4912418sh5m4btt0s
      COGNITO_DOMAIN: https://theagentorg-shared-reviewers.auth.us-east-1.amazoncognito.com
      HOSTNAME: 0.0.0.0
      # THE READERS NEED THE PACKAGE ON sys.path. `web/lib/pipeline.ts` spawns one
      # short-lived `python` per read — a deliberate architecture, because a Node database
      # client has no `current_tenant()`, so scoped WRITES fail loudly while scoped READS
      # SUCCEED UNSCOPED, which is how a tenant leak ships green.
      AGENTORG_PYTHON: /usr/bin/python3
      PYTHONPATH: /repo
      # TWO VARIABLES, ONE DATABASE, AND THEY ARE READ BY DIFFERENT LANGUAGES.
      # `DATABASE_URL` above is Auth.js's, read by the Node adapter for sessions.
      # `TENANT_DB` is `agentorg.tenancy`'s, read by the Python readers. Setting only the
      # first is what produced `PipelineError: the pipeline read failed` with
      # `/api/session` still answering 200 — the session path never touches a reader, so
      # the missing variable was invisible on the first route anybody checks.
      OFFLINE: "true"
      LLM_DISABLED: "true"
    volumes:
      # READ-ONLY, and the operator's real session rather than a key pasted into
      # this file. CLAUDE.md's rule is zero static AWS keys anywhere; a compose
      # file is exactly the place one would otherwise land and be committed.
      - ${HOME}/.aws:/aws:ro
      # `agentorg/` MOUNTED AT /app/agentorg, NOT AT /repo, and the path is the whole
      # point. `pipeline.ts:220-224` spawns the reader with `cwd: REPO_ROOT` and
      # `PYTHONPATH: REPO_ROOT`, both computed from `import.meta.url` — which inside this
      # image resolves to `/app`, not to wherever the repository is mounted. So it
      # OVERRIDES any PYTHONPATH set here, and the reader failed with
      # `ModuleNotFoundError: No module named 'agentorg'` while `TENANT_DB` was correctly
      # set and the package sat readable at /repo.
      #
      # Mounting the package where the app already looks is the fix that needs no code
      # change. `:ro` because the web app has no business writing to a checkout — its only
      # state is in Postgres.
      #
      # The image cannot simply CONTAIN it: this service's build context is `web/`, and
      # widening it to the repository root would trace `runs/` (~10k gitignored files)
      # into a Node image.
      # AT `/`, NOT `/app`, AND THE ARITHMETIC IS WHY. `pipeline.ts:78` computes
      # `REPO_ROOT` as `dirname(import.meta.url)/../..` — from `/app/lib` that is `/`, not
      # `/app`. It then spawns the reader with `cwd: REPO_ROOT` and
      # `PYTHONPATH: REPO_ROOT`, OVERRIDING whatever this file sets. Measured: with the
      # package at `/app/agentorg` and `python3 -c "import agentorg"` working from `/app`,
      # the reader still failed with `ModuleNotFoundError` — because it was looking at `/`.
      #
      # In a repository checkout `web/lib/../..` IS the repository root, so the expression
      # is correct there and wrong only for an image whose app lives one directory down.
      # Mounting where it looks costs nothing; changing the expression would be a code
      # change to make a container layout convenient, which is the wrong direction.
      - ../../agentorg:/agentorg:ro
      - ../../fixtures:/fixtures:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # The note this replaced, kept because its reasoning still governs what may be added:
  #
  # DELIBERATELY ABSENT, and this is a statement about the repository rather
  # than about compose. `agentorg/api/` and any UI belong to other lanes and do
  # not exist at this commit -- measured: no `agentorg/api`, no `agentorg/ui`.
  #
  # A service block pointing at them would parse, `docker compose config` would
  # pass, and the stack would fail at `up` with a missing module. That is the
  # failure shape this repository is most careful about: a check that passes for
  # a thing that does not exist. When those lanes land, add them here with
  # `depends_on: postgres` and the same `127.0.0.1:` port binding.
  #
  # `agentorg/approve_server.py` is NOT a substitute and must not be added. It
  # has no authentication at all and binds loopback for that reason; putting it
  # in a container means binding 0.0.0.0 inside the network namespace, and its
  # POST endpoints resume a paused pipeline past the security gate.

volumes:
  ollama:
