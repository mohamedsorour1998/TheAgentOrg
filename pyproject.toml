# Pinned deliberately: without this table pip falls back to an implicit
# setuptools>=40.8.0 fetched over the NETWORK for every build, which made
# tests/test_packaging.py skip (and so report green on a broken declaration)
# on any machine with a cold pip cache. >=61 is the floor for PEP 621
# ([project]) metadata plus the [tool.setuptools.packages.find] form used
# below. The upper bound keeps a future major from silently changing what
# ships: 84.0.0 is what `pip list` reports in .venv-sorour and is what the
# packaging tests were verified against, so <85 admits that and no new
# major. Bump both together, deliberately, and re-run tests/test_packaging.py.
[build-system]
requires = ["setuptools>=61,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "theagentorg"
version = "0.1.0"
description = "Multi-agent CI/CD pipeline on AWS Bedrock AgentCore with Strands"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "strands-agents",          # the agent framework (Sorour)
    "boto3",                   # AWS / Bedrock (Sorour)
    "PyGithub",                # github_ops (Mariam)
    "flask",                   # target_repo app (Reem)
    # Uncomment as each lane comes online:
    # "fastmcp",               # agent servers on AgentCore (Sorour, wk3)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    # tests/test_packaging.py builds a wheel, so it needs the build backend
    # DECLARED, not merely present by accident. Undeclared, that test silently
    # skips on any freshly built venv -- the exact hole ab1d5c8 closed for the
    # network case. CI installs `.[dev]` and nothing else (ci.yml:39, :70, :116),
    # so this is the only lever that pins it there. Kept in step with the
    # [build-system] bound above: bump both together, deliberately.
    "setuptools>=61,<85",
    # scripts/make_deck.py generates the hackathon deck. DEV-ONLY, deliberately:
    # it is a presentation tool and has no business inside the agent container,
    # where every extra dependency is another import that can fail at runtime on
    # arm64. Nothing under agentorg/ imports it, and tests/test_packaging.py
    # asserts what a non-editable install actually ships.
    "python-pptx>=1.0,<2",
]
# THE SELF-HOSTED PATH'S DEPENDENCIES. Both were missing entirely: `openai` until Lane F
# tried to reproduce F1 on a clean install, and `psycopg` until the whole stack was run
# under podman against a real Postgres.
#
# `config.LLM_BASE_URL` routes to an OpenAI-compatible gateway, and `strands` reaches
# it through `openai`. Measured: `pip show strands-agents` lists boto3, botocore,
# docstring-parser, httpx, jsonschema, mcp, opentelemetry-*, pydantic, pyyaml,
# typing-extensions, watchdog -- NO openai. It was installed on the development host
# by accident, so the seam appeared to work while being undeclared.
#
# ITS ABSENCE FAILED INTO A FIXTURE FALLBACK, which is why nobody noticed: a clean
# install raises ModuleNotFoundError inside the model call, `llm.text()` catches it by
# design, `structured()` returns None, every agent serves its fixture, and the run is
# green. The documented self-hosted path was unreproducible and reported success.
#
# A SEPARATE EXTRA, not `dev` and not the base install, for the reason `python-pptx`
# is dev-only: the five arm64 agent containers install
# `agentorg/agents/requirements.txt` and reach Bedrock directly, so an OpenAI client
# in there is one more import that can fail at runtime on arm64 for a code path those
# containers never take. `pip install .[selfhost]` is the self-hoster's line.
selfhost = [
    "openai>=1.0,<3",
    # THE POSTGRES DRIVER, and it belongs here rather than in the base install for the
    # same reason `openai` does: `agentorg/db/engine.py` reaches it only when the value
    # passed to `connect()` starts `postgresql://`, and the five arm64 agent containers
    # open no database at all. psycopg[binary] ships a compiled libpq wheel, so declaring
    # it at the base would put a native extension into five images for a branch they
    # cannot take.
    #
    # `tests/test_agentcore_deploy_assets.py` exempts it by name with that reasoning, and
    # the exemption's honesty depends on this line existing — a dependency exempted from
    # one requirements file and declared in NO other is not optional, it is missing.
    # Verified with the whole stack under podman: the worker and web images install this
    # extra and both read a real Postgres through that branch.
    "psycopg[binary]>=3,<4",
]

[tool.setuptools.packages.find]
include = ["agentorg*"]

[tool.setuptools.package-data]
"agentorg.security" = ["gitleaks.toml", "semgrep_rules.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Registered so an unknown-marker warning cannot hide a typo. A misspelled
# `@pytest.mark.real_snapshoot` would otherwise silently not apply, and the test
# would run against the stub it was written to bypass -- passing while measuring
# nothing, which is this repository's signature defect in miniature.
markers = [
    "real_snapshot: exercises repo_snapshot.snapshot itself, so the autouse stub in tests/test_repo_snapshot.py steps aside",
]
