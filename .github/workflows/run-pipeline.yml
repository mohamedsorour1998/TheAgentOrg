# Run the pipeline in the cloud, pausing at three human gates. OWNER: Sorour.
#
# This is the workflow the Aug 25 demo runs. A GitHub issue on the target repo
# reaches an EventBridge rule (infra/Terraform/modules/ingress), which dispatches
# this file; each agent call becomes an `invoke_agent_runtime` against one of the
# five Bedrock AgentCore runtimes, and each human approval is a GitHub
# Environment with a required reviewer.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY SEVEN JOBS AND NOT ONE `run_pipeline()` CALL
# ─────────────────────────────────────────────────────────────────────────────
# A GitHub Environment pauses a JOB, and a job cannot pause in its middle. So a
# pipeline whose gates are Environments cannot be one function call: it has to be
# cut at the gate boundaries, one job per segment.
#
#   plan ─▶ [gate1] ─▶ develop ─▶ [gate2] ─▶ sre ─▶ [gate3] ─▶ promote
#
# The `RunState` is handed along as an Actions artifact, written and read by
# `agentorg.gates.save`/`resume`, which existed for exactly this handoff before
# this file did.
#
# CORRECTED 2026-08-21: an earlier version of this note claimed Task 6 replaces
# the artifact with DynamoDB and "this chain does not change". That was never
# true. MEASURED with STATE_BACKEND=dynamodb: every stage after `plan` raises,
# because `scripts/run_stage.py:_load` calls `gates._state_path`, which refuses
# on that backend by design (agentorg/gates.py:116-121). This workflow uses the
# artifact handoff below and deliberately does NOT set STATE_BACKEND, so it runs
# on the `local` default. Moving this chain to DynamoDB needs a change in
# run_stage.py -- read through `gates.load` -- not only in gates.py.
#
# WHAT `develop` CONTAINS, AND WHY THAT IS NOT A SHORTCUT. develop runs the
# developer/reviewer revision loop, opens the PR, and evaluates the deterministic
# security block rule. Those four are one job because none of them is a gate
# boundary -- and the revision loop in particular cannot be split, because it
# iterates an unknown number of times and Actions cannot express "repeat this job
# until". A blocked run ends there with exit code 3 and gate2 is never reached,
# because gate2 `needs` it.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE THREE GATES ARE ENVIRONMENTS, NOT `if:` CONDITIONS
# ─────────────────────────────────────────────────────────────────────────────
# gate1, gate2 and gate3 each declare `environment: gateN` and do nothing else.
# Their purpose is to PAUSE. That placement is the point: an Environment's
# required reviewer is a repository SETTING, so no edit to this file -- and no
# workflow input -- can approve a gate on a human's behalf. A gate implemented as
# `if: inputs.auto_approve != true` would be skippable, and a skipped gate is
# indistinguishable downstream from an approved one.
#
# `auto_approve` therefore does NOT bypass a gate. It changes only how the
# recorded HumanDecision is attributed. It defaults false.
#
# THE ENVIRONMENTS MUST EXIST ON THE REPOSITORY or these jobs do not pause; they
# run. Creating them is a repo setting that no test in this repository can
# assert -- see the task report.
#
# ─────────────────────────────────────────────────────────────────────────────
# ZERO STATIC AWS KEYS
# ─────────────────────────────────────────────────────────────────────────────
# The three agent jobs (plan, develop, sre) assume github-actions-role through
# GitHub's OIDC provider. Do not add an AWS_ACCESS_KEY_ID secret to this
# repository; if a step here cannot authenticate, fix the role trust. The three
# gate jobs and promote hold NO credentials at all -- a pause needs none, and a
# human-approval job able to assume a role shared with three other repositories
# would be capability with no purpose.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE THREE SETTINGS THAT DECIDE WHETHER THIS RUN IS REAL
# ─────────────────────────────────────────────────────────────────────────────
# Each defaults to the harmless-looking value, and each one being wrong fails the
# SAME silent way: every stage reports green having proved nothing.
#
#   REMOTE_AGENTS=true  routes every agent call to its AgentCore runtime.
#                       config.REMOTE_AGENTS parses `== "true"` and defaults
#                       FALSE, so unset means all five agents run in-process on
#                       the runner and the five deployed runtimes are untouched.
#   DEMO_REPO           from a repository VARIABLE, so pointing at a different
#                       target repo is a settings change and not a commit.
#   GITHUB_TOKEN        from a SECRET. github_ops._use_local() returns
#                       `OFFLINE or not (GITHUB_TOKEN and GITHUB_REPO)`, and
#                       config.GITHUB_REPO reads the env var named DEMO_REPO --
#                       so all three must be right at once or the run does local
#                       git in a temp directory and opens no pull request.
#
# OFFLINE and LLM_DISABLED are deliberately absent. SCANNERS_REQUIRED is
# deliberately absent too: it belongs on the security RUNTIME only, and set here
# it would block the clean half of the demo.

name: run-pipeline

# Manual dispatch ONLY. A `push:` trigger here would invoke five runtimes and
# open a pull request on somebody else's repository on every commit to this one.
# The EventBridge target dispatches this same event through the REST API.
on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Ticket id, e.g. DEMO-1 or the GitHub issue number"
        required: true
        type: string
      ticket_text:
        description: "What to build, e.g. Add a per-IP login rate limit."
        required: true
        type: string
      poisoned:
        description: "Ask the developer for the diff with the hardcoded AWS key"
        required: false
        type: boolean
        default: false
      auto_approve:
        # Attribution only. The Environments still pause -- see the header.
        description: "Record the gate decisions as automatic (the gates still pause)"
        required: false
        type: boolean
        default: false

# One run at a time, and NEVER cancel one mid-flight: a cancelled run can leave a
# pull request open, a block comment posted and a gate approved with nothing on
# disk saying how it ended. Queue instead.
concurrency:
  group: run-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Not secret -- readable in the account and printed in plan output. Inline so a
  # reader can see what this workflow assumes without opening settings.
  AWS_ROLE: arn:aws:iam::339712964409:role/github-actions-role
  PYTHON_VERSION: "3.12"
  # Every job reads and writes the same state file, so the artifact name is one
  # definition. github.run_id keeps concurrent runs from colliding.
  STATE_ARTIFACT: run-state-${{ github.run_id }}
  # THE KNOB THAT MAKES THIS THE CLOUD PIPELINE. See the header.
  REMOTE_AGENTS: "true"

jobs:
  # ── PLAN ────────────────────────────────────────────────────────────────────
  #
  # The only job that creates a RunState rather than loading one. Its run_id is
  # published as an output because every later job needs it to find the state.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      run_id: ${{ steps.stage.outputs.run_id }}
    env:
      REMOTE_AGENTS: "true"
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: run-pipeline-plan-${{ github.run_id }}

      # Proves OIDC worked before any runtime is invoked, so an auth failure
      # reads as one instead of as an agent error.
      - name: Who am I
        run: aws sts get-caller-identity

      # The stage's run_id goes to GITHUB_OUTPUT by parsing the script's own
      # `run_id=` line rather than being generated here: the RunState's uuid is
      # created by the model's default_factory, so this is the only place it
      # exists. tee keeps the full log visible while the value is extracted.
      - name: Plan
        id: stage
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          TICKET_TEXT: ${{ inputs.ticket_text }}
          POISONED: ${{ inputs.poisoned }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py plan \
            --ticket-id "$TICKET_ID" \
            --ticket-text "$TICKET_TEXT" \
            --poisoned "$POISONED" | tee stage.log
          # `|| true` is what makes the guard below REACHABLE, and it is the whole
          # point of this line. MEASURED: under `set -euo pipefail`, a log with no
          # `run_id=` line makes grep exit 1 and kill the step immediately -- so
          # without this the guard fired only for a literal empty `run_id=` line,
          # never for the missing-line case its own message describes. Probed:
          # with the bare pipeline the step exits 1 and "GUARD FIRED" never
          # prints; with `|| true` it prints and then exits 1 deliberately.
          #
          # Suppressing grep's status is safe here precisely BECAUSE the guard
          # exists: the empty-string case is caught explicitly one line down, with
          # a message naming what went wrong. `|| true` without that guard would
          # be the real defect -- a missing run_id sailing on as an empty string.
          run_id="$(grep -m1 '^run_id=' stage.log | cut -d= -f2 || true)"
          if [ -z "$run_id" ]; then
            echo "::error::the plan stage printed no run_id; nothing downstream can find its state"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # if-no-files-found: error, on every upload in this file. The default is
      # `warn`, which publishes an EMPTY artifact as a successful step -- and the
      # next job's download then succeeds against nothing, so "the previous stage
      # produced no state" surfaces as a missing-file error one job later.
      - name: Upload run state
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}
          path: runs/
          if-no-files-found: error
          retention-days: 5

  # ── GATE 1 ──────────────────────────────────────────────────────────────────
  #
  # Does nothing but exist. `environment: gate1` is what pauses it; the job body
  # records the decision that the click already made, so runs/<run_id>.jsonl
  # carries the same row an interactive local run would have written.
  #
  # No `if:` and no credentials. Both absences are deliberate and both are
  # asserted by tests/test_run_pipeline_workflow.py.
  gate1:
    needs: plan
    runs-on: ubuntu-latest
    # A human has to click. This caps how long a run may hold its concurrency
    # slot waiting, not how long the work takes.
    timeout-minutes: 60
    environment: gate1
    permissions:
      contents: read
    # The gate posts its decision to the issue/PR, so it needs the GitHub seam --
    # but NO AWS credentials: recording an approval reaches no runtime. Without
    # these two, `github_ops._use_local()` takes its offline branch and the gate
    # comment degrades to a `local://` ref, so the approval a judge is looking for
    # never appears while the job still reports green.
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}
          path: runs/

      - name: Record the gate1 decision
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          AUTO_APPROVE: ${{ inputs.auto_approve }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py gate1 \
            --run-id "$RUN_ID" \
            --auto-approve "$AUTO_APPROVE" \
            --approver "$APPROVER"

      - name: Upload run state
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate1
          path: runs/
          if-no-files-found: error
          retention-days: 5

  # ── DEVELOP + REVIEW + PR + SECURITY ────────────────────────────────────────
  #
  # See run_stage.py's `_stage_develop` for why these four share a job, and why
  # the block rule is evaluated BEFORE the reviewer's verdict is treated as
  # terminal. Exit code 3 means "blocked by the deterministic rule" -- the
  # pipeline working -- and is distinct from 1, a crash.
  develop:
    needs: [plan, gate1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      REMOTE_AGENTS: "true"
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: run-pipeline-develop-${{ github.run_id }}

      - name: Who am I
        run: aws sts get-caller-identity

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate1
          path: runs/

      - name: Develop, review, open the PR, run the security gate
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          POISONED: ${{ inputs.poisoned }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py develop \
            --run-id "$RUN_ID" \
            --poisoned "$POISONED"

      # `if: always()`, and it is the one place in this file that needs it. A
      # BLOCKED run exits non-zero on purpose, and its state -- carrying the
      # verdict, the findings and the PR url -- is the most important artifact
      # this workflow produces. Without always() a blocked run would upload
      # nothing and the block would exist only in the job log.
      - name: Upload run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-develop
          path: runs/
          if-no-files-found: error
          retention-days: 5

  # ── GATE 2 ──────────────────────────────────────────────────────────────────
  #
  # "The scanners passed; ship it?" Unreachable on a blocked run, because it
  # needs `develop` and a block fails that job. That is the auto-block: no `if:`
  # expresses it, the dependency does.
  gate2:
    needs: [plan, develop]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: gate2
    permissions:
      contents: read
    # The gate posts its decision to the issue/PR, so it needs the GitHub seam --
    # but NO AWS credentials: recording an approval reaches no runtime. Without
    # these two, `github_ops._use_local()` takes its offline branch and the gate
    # comment degrades to a `local://` ref, so the approval a judge is looking for
    # never appears while the job still reports green.
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-develop
          path: runs/

      - name: Record the gate2 decision
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          AUTO_APPROVE: ${{ inputs.auto_approve }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py gate2 \
            --run-id "$RUN_ID" \
            --auto-approve "$AUTO_APPROVE" \
            --approver "$APPROVER"

      - name: Upload run state
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate2
          path: runs/
          if-no-files-found: error
          retention-days: 5

  # ── SRE ─────────────────────────────────────────────────────────────────────
  sre:
    needs: [plan, gate2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      REMOTE_AGENTS: "true"
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: run-pipeline-sre-${{ github.run_id }}

      - name: Who am I
        run: aws sts get-caller-identity

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate2
          path: runs/

      - name: SRE readiness
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py sre --run-id "$RUN_ID"

      - name: Upload run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-sre
          path: runs/
          if-no-files-found: error
          retention-days: 5

  # ── GATE 3 ──────────────────────────────────────────────────────────────────
  #
  # Final go/no-go. Unreachable on an SRE no_go for the same structural reason
  # gate2 is unreachable on a block.
  gate3:
    needs: [plan, sre]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: gate3
    permissions:
      contents: read
    # The gate posts its decision to the issue/PR, so it needs the GitHub seam --
    # but NO AWS credentials: recording an approval reaches no runtime. Without
    # these two, `github_ops._use_local()` takes its offline branch and the gate
    # comment degrades to a `local://` ref, so the approval a judge is looking for
    # never appears while the job still reports green.
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-sre
          path: runs/

      - name: Record the gate3 decision
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          AUTO_APPROVE: ${{ inputs.auto_approve }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py gate3 \
            --run-id "$RUN_ID" \
            --auto-approve "$AUTO_APPROVE" \
            --approver "$APPROVER"

      - name: Upload run state
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate3
          path: runs/
          if-no-files-found: error
          retention-days: 5

  # ── PROMOTE ─────────────────────────────────────────────────────────────────
  #
  # No credentials and no agent call: past gate3 there is nothing left to decide,
  # only a status to write and a log row to append. The final state is uploaded
  # as its own artifact so `runs/<run_id>.state.json` and the jsonl timeline are
  # downloadable from the run.
  promote:
    needs: [plan, gate3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate3
          path: runs/

      - name: Promote
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py promote --run-id "$RUN_ID"

      - name: Upload the final run state
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-final
          path: runs/
          if-no-files-found: error
          retention-days: 30

  # ── gate1 REJECTION RECORDER ─────────────────────────────────────────────────
  #
  # Runs when `gate1` did NOT. GitHub SKIPS a job whose Environment a reviewer
  # rejected, so nothing inside the gate job executes on a refusal -- which is why
  # a branch in there could never record one. This job's `if:` fires on exactly
  # the states the gate did not reach.
  #
  # `always()` here is the ONE correct use of an outcome-ignoring condition in
  # this file, and it is the opposite of the defect the tests forbid elsewhere: it
  # does not ADVANCE a run past a gate, it RECORDS that the run stopped. Without
  # it a refused run and an in-flight run are byte-identical on disk -- both
  # `status="running"` -- which is the bug `agentorg/gates.py:16-20` documents
  # being fixed once already.
  #
  # No credentials, no agent call: it writes a decision and posts a comment.
  gate1-rejected:
    needs: [plan, gate1]
    if: always() && needs.gate1.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}
          path: runs/

      - name: Record the gate1 refusal
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py gate1-rejected \
            --run-id "$RUN_ID" \
            --approver "$APPROVER"

      - name: Upload the rejected run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate1-rejected
          path: runs/
          if-no-files-found: error
          retention-days: 30

  # ── gate2 REJECTION RECORDER ─────────────────────────────────────────────────
  #
  # Runs when `gate2` did NOT. GitHub SKIPS a job whose Environment a reviewer
  # rejected, so nothing inside the gate job executes on a refusal -- which is why
  # a branch in there could never record one. This job's `if:` fires on exactly
  # the states the gate did not reach.
  #
  # `always()` here is the ONE correct use of an outcome-ignoring condition in
  # this file, and it is the opposite of the defect the tests forbid elsewhere: it
  # does not ADVANCE a run past a gate, it RECORDS that the run stopped. Without
  # it a refused run and an in-flight run are byte-identical on disk -- both
  # `status="running"` -- which is the bug `agentorg/gates.py:16-20` documents
  # being fixed once already.
  #
  # No credentials, no agent call: it writes a decision and posts a comment.
  gate2-rejected:
    needs: [plan, gate2]
    if: always() && needs.gate2.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-develop
          path: runs/

      - name: Record the gate2 refusal
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py gate2-rejected \
            --run-id "$RUN_ID" \
            --approver "$APPROVER"

      - name: Upload the rejected run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate2-rejected
          path: runs/
          if-no-files-found: error
          retention-days: 30

  # ── gate3 REJECTION RECORDER ─────────────────────────────────────────────────
  #
  # Runs when `gate3` did NOT. GitHub SKIPS a job whose Environment a reviewer
  # rejected, so nothing inside the gate job executes on a refusal -- which is why
  # a branch in there could never record one. This job's `if:` fires on exactly
  # the states the gate did not reach.
  #
  # `always()` here is the ONE correct use of an outcome-ignoring condition in
  # this file, and it is the opposite of the defect the tests forbid elsewhere: it
  # does not ADVANCE a run past a gate, it RECORDS that the run stopped. Without
  # it a refused run and an in-flight run are byte-identical on disk -- both
  # `status="running"` -- which is the bug `agentorg/gates.py:16-20` documents
  # being fixed once already.
  #
  # No credentials, no agent call: it writes a decision and posts a comment.
  gate3-rejected:
    needs: [plan, gate3]
    if: always() && needs.gate3.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO }}
      GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "."

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-sre
          path: runs/

      - name: Record the gate3 refusal
        env:
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python scripts/run_stage.py gate3-rejected \
            --run-id "$RUN_ID" \
            --approver "$APPROVER"

      - name: Upload the rejected run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_ARTIFACT }}-gate3-rejected
          path: runs/
          if-no-files-found: error
          retention-days: 30
